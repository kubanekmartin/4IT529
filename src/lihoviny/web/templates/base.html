<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}{% endblock %} · Lihoviny MAS</title>
  <style>
    /* Barvy a tvary celého webu; tmavý režim podle nastavení systému.
       Lahvově zelená a hnědá nesou vzhled, oranžová (--accent) jen důležité věci. */
    :root {
      --bg: #f6f6f7; --surface: #ffffff; --subtle: #f1f1f3; --text: #18181b; --muted: #6b6b74;
      --border: #e4e4e8; --accent: #c2570c; --accent-2: #e8892f; --accent-soft: #fdf0e7;
      --brand: #1f4d36; --brand-2: #2f6b4a; --brown: #6b4a2b;
      --link: #1f5c3d; --hover: #f1f1f3; --header-bg: rgb(255 255 255 / .8);
      --glow: rgb(31 77 54 / .09);
      --request: #1f5fa8; --inform: #2c7a3f; --query: #8a6100; --failure: #b42318;
      --radius: 16px; --radius-sm: 10px;
      --shadow: 0 1px 2px rgb(24 24 27 / .04), 0 1px 3px rgb(24 24 27 / .04);
      --shadow-hover: 0 4px 8px rgb(24 24 27 / .05), 0 12px 32px rgb(24 24 27 / .08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0e10; --surface: #17171a; --subtle: #1f1f23; --text: #f4f4f5; --muted: #a1a1aa;
        --border: #2a2a2f; --accent: #f0955a; --accent-2: #f7b27a; --accent-soft: #2c1a0f;
        --brand: #4f9a6f; --brand-2: #7cc49a; --brown: #c49a6c;
        --link: #8fd1a8; --hover: #222226; --header-bg: rgb(23 23 26 / .8);
        --glow: rgb(111 191 143 / .07);
        --request: #7fb0ec; --inform: #7ccf8f; --query: #e6c05c; --failure: #f2877d;
        --shadow: 0 1px 2px rgb(0 0 0 / .4); --shadow-hover: 0 8px 28px rgb(0 0 0 / .5);
      }
    }
    * { box-sizing: border-box; }
    html { scroll-padding-top: 5rem; }  /* kotva (#tabulka) nezajede pod lepivou hlavičku */
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column; color: var(--text);
      background: radial-gradient(70rem 24rem at 50% -8rem, var(--glow), transparent 70%) no-repeat, var(--bg);
      font: 16px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01";
    }
    /* Výchozí modrá prohlížeče je na tmavém pozadí nečitelná; navštívené odkazy stejně. */
    a { color: var(--link); text-underline-offset: 3px; text-decoration-thickness: 1px; }
    a:hover { text-decoration-thickness: 2px; }
    :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 6px; }

    /* Hlavička: značka a navigace jako přepínač; lepí se nahoře. */
    body > header {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: .75rem 1.5rem;
      padding: .625rem max(1rem, calc((100% - 74rem) / 2 + 1rem));
      background: var(--header-bg); border-bottom: 1px solid var(--border);
      backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px);
    }
    header .brand {
      display: inline-flex; align-items: center; gap: .625rem; flex: none;
      font-weight: 700; letter-spacing: -.015em; color: var(--text); text-decoration: none;
    }
    header .brand::before {
      content: "L"; display: grid; place-items: center; width: 2rem; height: 2rem;
      border-radius: 10px; color: #fff; font-weight: 800; font-size: 1rem;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      box-shadow: 0 2px 8px rgb(31 77 54 / .3), inset 0 1px 0 rgb(255 255 255 / .25);
    }
    body > header nav {
      display: flex; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none;
      padding: 3px; border-radius: 999px; background: var(--subtle); border: 1px solid var(--border);
    }
    body > header nav::-webkit-scrollbar { display: none; }
    body > header nav a {
      color: var(--muted); text-decoration: none; font-size: .875rem; font-weight: 500;
      padding: .3rem .75rem; border-radius: 999px; white-space: nowrap;
      transition: background-color .15s, color .15s, box-shadow .15s;
    }
    body > header nav a:hover { color: var(--text); }
    body > header nav a[aria-current="page"] {
      background: var(--surface); color: var(--text); font-weight: 600;
      box-shadow: 0 1px 2px rgb(24 24 27 / .08), 0 1px 4px rgb(24 24 27 / .06);
    }
    /* Na užším displeji jde navigace pod značku a dá se vodorovně posouvat. */
    @media (max-width: 68rem) {
      body > header { flex-direction: column; align-items: stretch; gap: .5rem; padding: .5rem 1rem; }
      body > header nav { align-self: flex-start; max-width: 100%; }
    }

    main { width: 100%; max-width: 74rem; margin: 0 auto; padding: 2rem 1rem 3rem; flex: 1; }
    h1 {
      font-size: clamp(1.75rem, 1.2rem + 2vw, 2.5rem); line-height: 1.15; font-weight: 800;
      letter-spacing: -.03em; margin: 0 0 .75rem;
    }
    main > h1 + p, main > h1 + .lead { font-size: 1.0625rem; color: var(--muted); }
    h2 { font-size: 1.25rem; font-weight: 700; letter-spacing: -.015em; }
    .muted { color: var(--muted); }
    details > summary { cursor: pointer; }
    button, input, select { font: inherit; }
    input, select { border-radius: var(--radius-sm); }

    /* Tabulky: tlumená hlavička, řádek zvýrazněný pod myší. */
    table { font-variant-numeric: tabular-nums; }
    thead th { font-size: .8125rem; font-weight: 600; color: var(--muted); }
    main table:not(.offers) thead th { background: var(--subtle); }
    main tbody tr { transition: background-color .1s; }
    main tbody tr:hover > td { background: var(--hover); }

    /* Karty: blok KIQ na Přehledu a vysvětlující box. */
    .kiq {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 1.25rem 1.5rem 1.5rem; margin: 0 0 1.25rem;
    }
    .kiq > h2 { margin: 0 0 .25rem; }
    .kiq .chart { background: var(--bg); box-shadow: none; }

    footer {
      border-top: 1px solid var(--border); color: var(--muted); font-size: .8125rem;
      padding: 1.25rem max(1rem, calc((100% - 74rem) / 2 + 1rem));
      display: flex; flex-wrap: wrap; gap: .25rem 1.5rem; justify-content: space-between;
    }
    footer a { color: inherit; }

    /* Grafy (lihoviny.charts): barvy řad validované pro barvoslepost, světlý i tmavý režim.
       Zelená a žlutá mají na bílé kontrast pod 3:1, proto graf vždy vypisuje hodnoty
       a nese tabulku dat. `s0` je šedá pro „ostatní“ vedle zvýrazněné řady. */
    :root {
      --series-1: #d4691b; --series-2: #2f6b4a; --series-3: #8b5a2b; --series-4: #c99a2e;
      --series-0: #a3a29c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --series-1: #f0955a; --series-2: #5fae80; --series-3: #c08a55; --series-4: #e0b850;
        --series-0: #6b6a66;
      }
    }
    .charts { display: grid; gap: 1rem; }
    .charts.wide { grid-template-columns: 1fr !important; margin: 0 0 1.5rem; }
    @media (min-width: 56rem) { .charts { grid-template-columns: 1fr 1fr; } }
    .chart {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 1.125rem 1.25rem; margin: 0; min-width: 0;
    }
    .chart figcaption { font-weight: 600; margin-bottom: .75rem; }
    .graf { display: block; overflow: visible; }
    .graf .label { fill: var(--text); }
    .graf .value { fill: var(--text); font-size: 12px; font-variant-numeric: tabular-nums; }
    .graf .tick { fill: var(--muted); font-size: 11px; }
    .graf .grid { stroke: var(--border); }
    .graf circle { stroke: var(--surface); }
    .graf rect.s0, .graf circle.s0 { fill: var(--series-0); }
    .graf rect.s1, .graf circle.s1 { fill: var(--series-1); }
    .graf rect.s2, .graf circle.s2 { fill: var(--series-2); }
    .graf rect.s3, .graf circle.s3 { fill: var(--series-3); }
    .graf rect.s4, .graf circle.s4 { fill: var(--series-4); }
    .graf line.s1 { stroke: var(--series-1); }
    .graf line.s2 { stroke: var(--series-2); }
    .graf line.s3 { stroke: var(--series-3); }
    .graf line.s4 { stroke: var(--series-4); }
    /* Další druhy grafů (lihoviny.charts_extra). */
    .graf .marker { stroke: var(--text); stroke-width: 1.5; }
    .graf .whisker { stroke: var(--muted); stroke-width: 1.5; }
    .graf .median { stroke: var(--text); stroke-width: 2.5; }
    .graf rect.box { fill-opacity: .3; stroke: var(--series-1); stroke-width: 1.5; }
    .graf .dot { fill-opacity: .7; stroke: none; }
    .graf .reference { stroke: var(--series-2); stroke-width: 1.5; }
    .graf circle.point { fill-opacity: .8; }
    .graf rect.segment { stroke: var(--surface); stroke-width: 2; }
    .graf rect.period { fill-opacity: .45; }
    .graf .hit { fill: transparent; stroke: none; }
    .graf polygon.s1, .graf polygon.s2, .graf polygon.s3, .graf polygon.s4 { stroke: var(--surface); }
    .graf polygon.s1 { fill: var(--series-1); } .graf polygon.s2 { fill: var(--series-2); }
    .graf polygon.s3 { fill: var(--series-3); } .graf polygon.s4 { fill: var(--series-4); }
    .graf polygon.band { fill-opacity: .2; stroke: none; }
    .graf rect.band { fill: var(--series-1); fill-opacity: .25; }
    .graf polyline.line { stroke: var(--series-1); }
    .graf .axis-name { font-weight: 600; }
    .heatmap {
      display: grid; grid-template-columns: minmax(6rem, max-content) repeat(var(--cols), minmax(2rem, 1fr));
      gap: 3px; font-size: .75rem; overflow-x: auto;
    }
    .heatmap .col { color: var(--muted); text-align: center; writing-mode: vertical-rl; transform: rotate(180deg); justify-self: center; padding: .25rem 0; max-height: 7rem; overflow: hidden; }
    .heatmap .row { color: var(--text); align-self: center; padding-right: .5rem; white-space: nowrap; }
    .heatmap .cell {
      display: grid; place-items: center; min-height: 2rem; border-radius: 6px;
      font-variant-numeric: tabular-nums; font-weight: 600; background: var(--subtle); color: var(--text);
    }
    .heatmap .h1 { background: color-mix(in srgb, var(--series-1) 18%, var(--surface)); }
    .heatmap .h2 { background: color-mix(in srgb, var(--series-1) 36%, var(--surface)); }
    .heatmap .h3 { background: color-mix(in srgb, var(--series-1) 56%, var(--surface)); }
    .heatmap .h4 { background: color-mix(in srgb, var(--series-1) 76%, var(--surface)); color: #fff; }
    .heatmap .h5 { background: var(--series-1); color: #fff; }
    .calendar { font-size: .8125rem; }
    .calendar-legend { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem; color: var(--muted); margin-bottom: .5rem; }
    .calendar-legend .cell { margin-left: .5rem; }
    .calendar-row { display: grid; grid-template-columns: 8.5rem 1fr; align-items: center; gap: .5rem; margin-bottom: 4px; }
    .calendar .days { display: grid; grid-template-columns: repeat(var(--days), minmax(0, 1fr)); gap: 2px; }
    .calendar .cell {
      display: inline-grid; place-items: center; min-width: 0; height: 1.25rem; border-radius: 3px;
      font-size: .625rem; font-weight: 700; color: #fff; overflow: hidden;
    }
    .calendar-legend .cell { width: 1rem; }
    .calendar .ok { background: var(--inform); }
    .calendar .fail { background: var(--failure); }
    .calendar .none { background: var(--subtle); color: var(--muted); }
    .calendar-axis { display: flex; justify-content: space-between; color: var(--muted); font-size: .75rem; margin-left: 9rem; }
    @media (max-width: 30rem) { .calendar-row { grid-template-columns: 1fr; } .calendar-axis { margin-left: 0; } }
    .spark { display: block; margin-top: .5rem; overflow: visible; }
    .spark-area { fill: var(--brand-2); fill-opacity: .12; }
    .spark-line { stroke: var(--brand-2); }
    .spark-dot { fill: var(--brand-2); stroke: var(--surface); stroke-width: 1.5; }
    .chart details { margin-top: .5rem; font-size: .875rem; }
    .chart table { border-collapse: collapse; width: 100%; margin-top: .25rem; }
    .chart th, .chart td { text-align: left; padding: .2rem .4rem; border-bottom: 1px solid var(--border); }
    .chart th { color: var(--muted); font-weight: 600; }
    .chart .jak-cist { color: var(--muted); }
    .chart .jak-cist p { margin: .25rem 0 0; }

    /* Dlaždice s jedním číslem (komponenty.html: stat_tile). */
    .tiles {
      display: grid; gap: .875rem; margin: 0 0 1.75rem; grid-template-columns: repeat(2, 1fr);
    }
    @media (min-width: 40rem) { .tiles { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 72rem) { .tiles { grid-template-columns: repeat(6, 1fr); } }
    .tile {
      position: relative; display: flex; flex-direction: column; overflow: hidden;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 1.125rem 1.25rem; color: var(--text); text-decoration: none;
      transition: box-shadow .2s, transform .2s, border-color .2s;
    }
    .tile::before {
      content: ""; position: absolute; inset: 0 0 auto; height: 3px;
      background: linear-gradient(90deg, var(--brand), var(--brown)); opacity: .85;
    }
    a.tile:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); border-color: transparent; }
    a.tile::after {
      content: "→"; position: absolute; top: 1rem; right: 1.125rem; color: var(--muted);
      transition: transform .2s, color .2s;
    }
    a.tile:hover::after { transform: translateX(3px); color: var(--brand-2); }
    .tile .value {
      display: block; font-size: 2.25rem; font-weight: 800; line-height: 1.1; letter-spacing: -.03em;
      font-variant-numeric: tabular-nums;
    }
    .tile .label { display: block; font-size: .9375rem; font-weight: 600; margin-top: .375rem; }
    .tile .note { display: block; font-size: .8125rem; color: var(--muted); margin-top: .25rem; }
    .freshness {
      display: inline-flex; align-items: center; gap: .4rem; font-size: .8125rem; color: var(--muted);
      margin: 0 0 1rem;
    }
    .freshness.live::before {
      content: ""; width: .5rem; height: .5rem; border-radius: 50%; background: var(--inform);
      box-shadow: 0 0 0 3px rgb(44 122 63 / .15);
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <a class="brand" href="/">Lihoviny MAS</a>
    <nav>
      {% for path, label in nav %}
      <a href="{{ path }}"{% if request.url.path == path %} aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <span>Lihoviny MAS · multiagentní konkurenční zpravodajství, studijní prototyp 4IT529</span>
    <span><a href="/architektura">Jak systém funguje</a></span>
  </footer>
</body>
</html>
