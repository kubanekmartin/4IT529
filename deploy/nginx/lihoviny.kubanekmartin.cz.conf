# lihoviny.kubanekmartin.cz: web multiagentního systému (repo kubanekmartin/4IT529).
# Na server ho instaluje `deploy/setup-server.sh web` do /etc/nginx/sites-available/.
# Aplikace běží v Dockeru na 127.0.0.1:8510; nginx dělá jen TLS a reverzní proxy,
# žádný další veřejný port se neotevírá.

server {
    listen 80;
    listen [::]:80;
    server_name lihoviny.kubanekmartin.cz;
    server_tokens off;

    # Ověření certbotem (HTTP-01 přes webroot, i při obnově) se nepřesměrovává.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/lihoviny.kubanekmartin.cz/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://lihoviny.kubanekmartin.cz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lihoviny.kubanekmartin.cz;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/lihoviny.kubanekmartin.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lihoviny.kubanekmartin.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Studijní prototyp s daty třetích stran: vyhledávače ho nesmí indexovat. Hlavičku posílá
    # i aplikace; nginx ji nahradí vlastní, aby platila i pro chybové stránky (502 při nasazení).
    proxy_hide_header X-Robots-Tag;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Web nemá JavaScript ani formuláře: CSP zakáže každý skript (i `javascript:` v odkazu ze
    # zdroje), vkládání do cizích stránek a pluginy. Styly a inline SVG grafy zůstávají povolené.
    add_header Content-Security-Policy "script-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        proxy_pass http://127.0.0.1:8510;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
